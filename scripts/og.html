<!doctype html>
<!-- Imagem de prévia de link (Open Graph), 1200×630. Gerar com: node scripts/gerar_og.mjs -->
<html lang="pt-BR"><head><meta charset="utf-8">
<style>
@font-face { font-family: Inter; font-weight: 500; src: url(../lib/fonts/inter-latin-500-normal.woff2) format('woff2'); }
@font-face { font-family: Inter; font-weight: 700; src: url(../lib/fonts/inter-latin-700-normal.woff2) format('woff2'); }
@font-face { font-family: Inter; font-weight: 800; src: url(../lib/fonts/inter-latin-800-normal.woff2) format('woff2'); }
* { box-sizing: border-box; margin: 0; }
body { width: 1200px; height: 630px; overflow: hidden; font-family: Inter, sans-serif; color: #fff;
  background: linear-gradient(115deg, #006b2d 0%, #009c3b 45%, #0a5ea8 100%); position: relative; }
.faixa { position: absolute; left: 0; right: 0; bottom: 0; height: 14px; background: #ffdf00; }
.txt { position: absolute; left: 72px; top: 70px; width: 700px; }
.chapeu { font-size: 26px; font-weight: 700; letter-spacing: .06em; opacity: .92; }
h1 { font-size: 84px; font-weight: 800; line-height: 1; margin: 18px 0 22px; letter-spacing: -.02em; }
h1 span { color: #ffdf00; }
p { font-size: 31px; font-weight: 500; line-height: 1.3; opacity: .96; }
.chips { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 34px; }
.chips b { font-size: 23px; font-weight: 700; padding: 9px 18px; border-radius: 999px; background: rgb(255 255 255 / 16%); border: 2px solid rgb(255 255 255 / 35%); }
.autor { position: absolute; right: 70px; top: 92px; width: 330px; text-align: center; }
.autor img { width: 300px; height: 300px; border-radius: 50%; object-fit: cover; border: 10px solid #ffdf00; box-shadow: 0 18px 40px rgb(0 0 0 / 30%); }
.autor strong { display: block; font-size: 38px; font-weight: 800; margin-top: 18px; }
.autor small { display: block; font-size: 22px; font-weight: 500; opacity: .9; margin-top: 4px; }
</style></head>
<body>
  <div class="txt">
    <div class="chapeu">🗳️ ELEIÇÕES 2026 · SANTA CATARINA</div>
    <h1>Apuração <span>2026</span></h1>
    <p>Resultados por município, associação, zona, bairro e seção — com a comparação com 2022.</p>
    <div class="chips"><b>Dep. Federal</b><b>Dep. Estadual</b><b>Senado</b><b>Governador</b><b>Dados do TSE</b></div>
  </div>
  <div class="autor"><img src="../img/maicon-combat.jpg" alt=""><strong>@maiconcombat</strong><small>maiconcombat.com.br</small></div>
  <div class="faixa"></div>
</body></html>
