# Baixa os boletins de urna de SC, gera os dados por seção e bairro (dados2026/) e, se houver o
# segredo PRO_SENHA (ou PRO_CHAVE), refaz a área protegida (pro/). Roda sozinho na noite do 2º turno
# (25/10/2026) e pode ser disparado à mão em Actions → "Boletins de urna" → Run workflow.
name: Boletins de urna

on:
  workflow_dispatch:
    inputs:
      turno:
        description: Turno (1 ou 2)
        required: true
        default: '2'
  schedule:
    - cron: '30 22,23 25 10 *'   # 25/10, 19h30 e 20h30 em Brasília
    - cron: '30 1,3,5,9 26 10 *' # madrugada e manhã de 26/10

permissions:
  contents: write

concurrency:
  group: boletins
  cancel-in-progress: false

jobs:
  atualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install asn1tools cryptography
      - uses: actions/cache@v4
        with:
          path: .cache
          key: boletins-${{ github.run_id }}
          restore-keys: boletins-
      - name: Baixar boletins e gerar dados
        env:
          PRO_SENHA: ${{ secrets.PRO_SENHA }}
          PRO_CHAVE: ${{ secrets.PRO_CHAVE }}
          TURNO: ${{ github.event.inputs.turno || '2' }}
        run: python3 scripts/atualizar.py --turno "$TURNO"
      - name: Publicar
        env:
          TURNO: ${{ github.event.inputs.turno || '2' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dados2026 pro
          if git diff --cached --quiet; then echo "Nada novo."; exit 0; fi
          git commit -m "Boletins de urna: dados por seção e bairro (${TURNO}º turno)"
          git pull --rebase origin ${{ github.ref_name }}
          git push
