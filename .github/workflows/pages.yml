# Publica o front-end no GitHub Pages (https://maiconcombatoficial.github.io/resultadoeleicao/)
# a cada push na main. É só o site estático: no Pages não existe a API (/api), então a aba
# "👥 Equipe" avisa que o servidor está indisponível. A versão completa (com Neon) fica no Vercel.
# Em Settings → Pages, escolha "GitHub Actions" como fonte.
name: GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
