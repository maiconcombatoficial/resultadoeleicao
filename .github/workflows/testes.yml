# Testes automáticos: rodam em cada PR e em cada publicação na main.
# Conferem os tipos da API, o build do Vite, os testes da API (node --test) e abrem o app num
# Chromium de celular (tests/app.spec.js), com os dados do TSE gravados em tests/fixtures/tse.
name: Testes

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  testes:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Instalar dependências
        run: npm ci
      - name: Sintaxe dos módulos do app
        run: npm run lint
      - name: Tipos da API
        run: npm run typecheck
      - name: Testes da API
        run: npm run test:api
      - name: Build do front-end
        run: npm run build
      - name: Empacotar o Worker (Cloudflare, sem publicar)
        run: npx wrangler deploy --dry-run --outdir .wrangler/dist
      - name: Instalar o Chromium
        run: npx playwright install --with-deps chromium
      - name: Testes do app
        run: npx playwright test
      - name: Guardar evidências da falha
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: resultados-dos-testes
          path: test-results/
          retention-days: 7
